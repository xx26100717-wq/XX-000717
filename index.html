<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>高性价比人生指南 Ultimate</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="hero">
<h1>🌱 高性价比人生指南</h1>
<p>3分钟生成你的专属人生行动路线</p>
</div>

<div class="container">
<div class="card">
<h2>创建你的个人画像</h2>

<label>年龄阶段（示例：26-35岁）</label>
<select id="age">
<option>18-25岁</option><option>26-35岁</option><option>36-45岁</option><option>46-55岁</option><option>56岁以上</option>
</select>

<label>收入阶段（示例：15000-30000）</label>
<select id="income">
<option>5000以下</option><option>5000-15000</option><option>15000-30000</option><option>30000-50000</option><option>50000以上</option>
</select>

<label>职业状态</label>
<select id="career">
<option>学生</option><option>普通职员</option><option>专业人士</option><option>管理者</option><option>创业者</option><option>自由职业</option>
</select>

<h3>家庭状态（可多选）</h3>
<div id="family"></div>

<h3>最大担忧（最多选择3项）</h3>
<div id="fear"></div>

<label>健康状态</label>
<select id="health">
<option>很好</option><option>偶尔疲劳</option><option>长期压力大</option><option>睡眠问题</option><option>慢性问题</option>
</select>

<label>财富状态</label>
<select id="wealth">
<option>没有积蓄</option><option>3-6个月储备</option><option>有资产</option><option>有投资经验</option><option>财务自由目标</option>
</select>

<label>每周投入时间</label>
<select id="time">
<option>30分钟以内</option><option>1-3小时</option><option>3-5小时</option><option>5小时以上</option>
</select>

<button onclick="generate()">生成我的人生指南</button>
</div>
<div id="result"></div>
</div>

<script src="js/app.js"></script>
</body>
</html>
