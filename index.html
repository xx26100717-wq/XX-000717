<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>高性价比人生指南</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>高性价比人生指南</h1>
<p>回答几个问题，生成你的个人行动路线。</p>

<div class="card">
<h3>你的画像</h3>
<input id="age" placeholder="年龄（例如：32）">
<input id="income" placeholder="月收入（例如：20000）">

<h3>家庭情况（可多选）</h3>
<div id="family">
<label><input type="checkbox" value="单身">单身</label>
<label><input type="checkbox" value="已婚有孩">已婚有孩</label>
<label><input type="checkbox" value="房贷">有房贷</label>
<label><input type="checkbox" value="老人">需要照顾老人</label>
</div>

<h3>最担心什么（可多选）</h3>
<div id="fear">
<label><input type="checkbox" value="失业">收入下降/失业</label>
<label><input type="checkbox" value="健康">健康风险</label>
<label><input type="checkbox" value="养老">养老压力</label>
<label><input type="checkbox" value="迷茫">人生方向</label>
</div>

<select id="time">
<option>每周30分钟以内</option>
<option>每周1-3小时</option>
<option>每周3-5小时</option>
<option>每周5小时以上</option>
</select>

<button onclick="generate()">生成我的指南</button>
</div>

<div id="result"></div>
</div>
<script src="app.js"></script>
</body>
</html>
